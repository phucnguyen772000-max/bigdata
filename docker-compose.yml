name: bigdata-diemthi

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION}
      SPARK_RUNTIME_IMAGE: bigdata-diemthi-spark-client:${SPARK_VERSION}
  image: bigdata-diemthi-airflow:${AIRFLOW_VERSION}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/airflow"
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    HADOOP_CONF_DIR: /opt/hadoop/conf
    PYSPARK_PYTHON: python3
    SPARK_HOME: /opt/spark
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
    - ./src:/opt/project/src:ro
    - ./hadoop/conf:/opt/hadoop/conf:ro
  user: "${AIRFLOW_UID:-50000}:0"
  networks: [bigdata-network]

services:
  namenode:
    image: apache/hadoop:${HADOOP_VERSION}
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /data/name
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/data
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks: [bigdata-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  datanode1:
    image: apache/hadoop:${HADOOP_VERSION}
    container_name: datanode1
    hostname: datanode1
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      WAITFOR: namenode:9000
      WAITFOR_TIMEOUT: "120"
    volumes:
      - datanode1_data:/data
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks: [bigdata-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[D]ataNode' && hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  datanode2:
    image: apache/hadoop:${HADOOP_VERSION}
    container_name: datanode2
    hostname: datanode2
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      WAITFOR: namenode:9000
      WAITFOR_TIMEOUT: "120"
    volumes:
      - datanode2_data:/data
      - ./hadoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    networks: [bigdata-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[D]ataNode' && hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  spark-master:
    build:
      context: ./spark
      args:
        SPARK_IMAGE: apache/spark:${SPARK_IMAGE_TAG}
    image: bigdata-diemthi-spark:${SPARK_VERSION}
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/conf
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./hadoop/conf:/opt/hadoop/conf:ro
    networks: [bigdata-network]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/spark-master/7077'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker1:
    image: bigdata-diemthi-spark:${SPARK_VERSION}
    container_name: spark-worker1
    hostname: spark-worker1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1536m", "--webui-port", "8081", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/conf
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./hadoop/conf:/opt/hadoop/conf:ro
    networks: [bigdata-network]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[o]rg.apache.spark.deploy.worker.Worker'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker2:
    image: bigdata-diemthi-spark:${SPARK_VERSION}
    container_name: spark-worker2
    hostname: spark-worker2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1536m", "--webui-port", "8081", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/conf
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./hadoop/conf:/opt/hadoop/conf:ro
    networks: [bigdata-network]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[o]rg.apache.spark.deploy.worker.Worker'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-client:
    build:
      context: ./spark-client
      args:
        SPARK_IMAGE: apache/spark:${SPARK_IMAGE_TAG}
    image: bigdata-diemthi-spark-client:${SPARK_VERSION}
    container_name: spark-client
    hostname: spark-client
    command: ["sleep", "infinity"]
    depends_on:
      namenode:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker1:
        condition: service_healthy
      spark-worker2:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/conf
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      SPARK_SUBMIT_OPTS: -Dspark.driver.host=spark-client -Dspark.driver.bindAddress=0.0.0.0
    volumes:
      - ./src:/app/src:ro
      - ./docs:/app/docs:rw
      - ./hadoop/conf:/opt/hadoop/conf:ro
    networks: [bigdata-network]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "test -x /opt/spark/bin/spark-submit && python3 --version >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    expose:
      - "9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [bigdata-network]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic diemthi_realtime
        --partitions 1 --replication-factor 1
    networks: [bigdata-network]
    restart: "no"

  airflow-postgres:
    image: postgres:16-alpine
    container_name: airflow-postgres
    hostname: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    networks: [bigdata-network]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname BigData \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    hostname: airflow-webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8088:8080"
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker1:
        condition: service_healthy
      spark-worker2:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

  dashboard:
    build:
      context: ./dashboard
      args:
        SPARK_IMAGE: apache/spark:${SPARK_IMAGE_TAG}
    image: bigdata-diemthi-dashboard:${SPARK_VERSION}
    container_name: dashboard
    hostname: dashboard
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/conf
      PYSPARK_PYTHON: python3
      PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      SPARK_LOCAL_HOSTNAME: dashboard
      SPARK_SUBMIT_OPTS: -Dspark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension -Dspark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard:ro
      - ./hadoop/conf:/opt/hadoop/conf:ro
    networks: [bigdata-network]
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

networks:
  bigdata-network:
    name: bigdata-network
    driver: bridge

volumes:
  namenode_data:
    name: namenode_data
  datanode1_data:
    name: datanode1_data
  datanode2_data:
    name: datanode2_data
  kafka_data:
    name: kafka_data
  airflow_db:
    name: airflow_db
  airflow_logs:
    name: airflow_logs
